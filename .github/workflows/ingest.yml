name: Re-ingest knowledge base

on:
  schedule:
    - cron: "0 9 * * 1" # Mondays 09:00 UTC (~2am PT)
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - run: pip install -r backend/requirements.txt

      - name: Run ingestion
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python backend/ingest_unstructured.py

      - name: Commit updated kb.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add backend/kb.json
          if git diff --cached --quiet; then
            echo "kb.json unchanged, nothing to commit"
          else
            git commit -m "chore: scheduled kb re-ingest"
            git push
          fi
