<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />  <!-- Mobile-friendly meta tag -->
  <title>Ask USG — USC Undergraduate Student Government</title>
  <link rel="icon" type="image/png" href="favicon.png" />
  <link rel="apple-touch-icon" href="tommy.png" />
  <style>
    /* Reusable theme values with var(--name) */
    /* All colors from the 2026 USG Brand Guidelines palette (p.5).
       Dark Red #990000 + Primary Yellow #FFCC00 are USC's official
       Cardinal and Gold; neutrals are #2A2A2A / #D1D1D1 / #F4F0EC. */
    :root {
      --bg: #ffffff;
      --panel: #ffffff;
      --border: #d1d1d1;
      --text: #2a2a2a;
      --muted: #6b6b6b;
      --user: #ffffff;
      --bot: #2a2a2a;
      --cardinal: #990000;
      --gold: #ffcc00;
      --paper: #f4f0ec;
      --link-hover: #198bd6;
      --accent: #990000;
      --accent-hover: #ef3b39;
      --shadow: 0 20px 50px rgba(0, 0, 0, 0.18);
    }

    /* Global layout rules */

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--text);
      background: var(--bg);
      min-height: 100vh;
    }

    /* Markdown-style message formatting helpers */

    .bubble p {
      margin: 0 0 0.5em;
    }

    .bubble p:first-child {
      margin-top: 0;
    }

    .bubble p:last-child {
      margin-bottom: 0;
    }

    .bubble ul,
    .bubble ol {
      margin: 0.35em 0;
      padding-left: 1.25em;
    }

    .bubble li {
      margin: 0.15em 0;
    }

    .bubble h1,
    .bubble h2,
    .bubble h3,
    .bubble h4,
    .bubble h5,
    .bubble h6 {
      margin: 0.5em 0 0.25em;
    }

    /* Floating launcher button */
    .chat-launcher {
      position: fixed;
      right: 24px;
      bottom: 24px;
      width: 64px;
      height: 64px;
      border: none;
      border-radius: 50%;
      background: none;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 12px 30px rgba(153, 0, 0, 0.35);
      z-index: 1000;
      transition: transform 0.18s ease, box-shadow 0.18s ease;
      background: #ffffff;
      border: 3px solid var(--cardinal);
      border-radius: 50%;
      overflow: hidden;
    }

    .chat-launcher:hover {
      transform: translateY(-2px) scale(1.03);
      box-shadow: 0 16px 36px rgba(153, 0, 0, 0.45);
    }

    .chat-launcher:active {
      transform: scale(0.98);
    }

    .chat-launcher span {
      font-size: 22px;
      font-weight: 700;
      letter-spacing: -0.03em;
    }

    /* Overlay backdrop */
    .chat-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.35);
      backdrop-filter: blur(3px);
      display: none;
      align-items: flex-end;
      justify-content: flex-end;
      padding: 24px;
      z-index: 999;
    }

    .chat-backdrop.open {
      display: flex;
    }

    /* Chat panel */
    .chat-panel {
      width: min(420px, calc(100vw - 32px));
      height: min(680px, calc(100vh - 64px));
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 24px;
      box-shadow: var(--shadow);
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    .chat-header {
      padding: 12px 16px;
      border-bottom: 3px solid var(--gold);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      background: var(--cardinal);
    }

    .chat-header-left {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
    }

    .mini-avatar {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: linear-gradient(135deg, #2563eb, #7c3aed);
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-weight: 700;
      flex-shrink: 0;
    }

    .chat-title-wrap {
      min-width: 0;
    }

    .chat-title {
      margin: 0;
      font-size: 17px;
      font-weight: 700;
      line-height: 1.2;
      color: #ffffff;
      /* brand hero font (free on Google Fonts as Source Serif 4);
         body stays system sans until USG's licensed Neue Montreal lands */
      font-family: "Source Serif 4", "Source Serif Pro", Georgia, serif;
    }

    .chat-subtitle {
      margin: 2px 0 0;
      font-size: 12px;
      /* brand rule: text on dark shades must be white (gold text on dark
         is reserved for the logo) — the gold accent lives in the border */
      color: #ffffff;
      opacity: 0.85;
    }

    .chat-close {
      border: none;
      background: transparent;
      color: rgba(255, 255, 255, 0.75);
      font-size: 28px;
      line-height: 1;
      cursor: pointer;
      padding: 0 4px;
      flex-shrink: 0;
    }

    .chat-close:hover {
      color: #ffffff;
    }

    .messages {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      background: #fff;
    }

    .msg {
      margin-bottom: 14px;
      display: flex;
      flex-direction: column;
    }

    .bubble {
      max-width: 90%;
      padding: 10px 14px;
      border-radius: 18px;
      /* no pre-wrap: content is parsed Markdown; raw newlines between HTML
         blocks would render as stray blank space (esp. trailing) */
      word-wrap: break-word;
      line-height: 1.45;
      font-size: 14px;
    }

    .user {
      align-items: flex-end;
    }

    .user .bubble {
      background: var(--cardinal);
      color: var(--user);
      border-bottom-right-radius: 6px;
    }

    .bot {
      align-items: flex-start;
    }

    .bot .bubble {
      background: var(--paper);
      color: var(--bot);
      border-bottom-left-radius: 6px;
    }

    .sources {
      margin-top: 8px;
      font-size: 12px;
      color: var(--muted);
    }

    .feedback {
      margin-top: 6px;
      display: flex;
      gap: 6px;
    }

    .feedback button {
      border: 1px solid var(--border);
      background: #fff;
      border-radius: 10px;
      padding: 2px 8px;
      font-size: 13px;
      cursor: pointer;
      opacity: 0.75;
    }

    .feedback button:hover {
      opacity: 1;
      border-color: var(--cardinal);
    }

    .feedback.done button {
      cursor: default;
      opacity: 0.35;
    }

    .feedback.done button.picked {
      opacity: 1;
      border-color: var(--cardinal);
    }

    .sources-label {
      margin-top: 6px;
      font-weight: 700;
      color: var(--text);
      font-size: 12px;
    }

    /* brand rule: links are underlined; hover per the guide's link style */
    .source-link {
      display: block;
      margin-top: 5px;
      color: var(--cardinal);
      text-decoration: underline;
      word-break: break-word;
    }

    .source-link:hover,
    .bubble a:hover {
      color: var(--link-hover);
    }

    .bubble a {
      color: var(--cardinal);
      text-decoration: underline;
    }

    .composer {
      border-top: 1px solid var(--border);
      padding: 12px;
      background: var(--paper);
    }

    .composer-row {
      display: flex;
      gap: 10px;
      align-items: center;
    }

    .composer input {
      flex: 1;
      padding: 12px 14px;
      border: 1px solid var(--border);
      border-radius: 14px;
      font-size: 14px;
      outline: none;
      background: white;
    }

    .composer input:focus {
      border-color: var(--cardinal);
      box-shadow: 0 0 0 3px rgba(153, 0, 0, 0.12);
    }

    .composer button {
      border: none;
      background: var(--accent);
      color: white;
      padding: 12px 16px;
      border-radius: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s ease;
    }

    .composer button:hover {
      background: var(--accent-hover);
    }

    .composer button:disabled {
      opacity: 0.7;
      cursor: not-allowed;
    }

    .status {
      margin-top: 8px;
      font-size: 12px;
      color: var(--muted);
      min-height: 16px;
    }

    .typing {
      font-style: italic;
      color: var(--muted);
    }

    @media (max-width: 640px) {
      .chat-backdrop {
        padding: 12px;
      }

      .chat-panel {
        width: 100%;
        height: min(84vh, 720px);
        border-radius: 20px;
      }

      .chat-launcher {
        right: 16px;
        bottom: 16px;
        width: 58px;
        height: 58px;
      }
    }

    .avatar-wrap {
      width: 100%;
      height: 100%;
      overflow: hidden;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* chat-scale avatar in the header, full-size in the launcher */
    .chat-header .avatar-wrap {
      width: 44px;
      height: 44px;
      flex-shrink: 0;
      background: #ffffff;
      border: 2px solid var(--gold);
    }

    .avatar-img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;

      filter: contrast(1.15) saturate(1.25) brightness(1.05);
      transform: scale(1.08);
    }

    /* --- Embed modes ---------------------------------------------------
       default (bubble): floating launcher + dimmed backdrop, for a
         top-level page.
       ?embed=panel: always-open panel filling the iframe — use inside an
         iframe on a dedicated "Ask USG" page.
       ?embed=overlay: bubble behavior on a transparent page, driven by
         embed.js as a site-wide corner iframe; reports open/closed to the
         parent via postMessage. */
    body.mode-panel .chat-launcher,
    body.mode-panel .chat-close {
      display: none;
    }

    body.mode-panel .chat-backdrop {
      display: flex;
      position: static;
      padding: 0;
      background: none;
      backdrop-filter: none;
      height: 100vh;
    }

    body.mode-panel .chat-panel {
      width: 100%;
      height: 100%;
      border-radius: 0;
      border: none;
    }

    body.mode-overlay {
      background: transparent;
    }

    body.mode-overlay .chat-backdrop {
      background: none;
      backdrop-filter: none;
    }
  </style>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,700&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.0.6/dist/purify.min.js"></script>   
</head>
<body>
  <button class="chat-launcher" id="launcher" aria-label="Open USG chat">
    <div class="avatar-wrap">
      <img src="tommy.png" alt="Chat avatar" class="avatar-img" />
    </div>
  </button>

  <div class="chat-backdrop" id="backdrop" aria-hidden="true">
    <div class="chat-panel" role="dialog" aria-modal="true" aria-labelledby="chatTitle">
      <div class="chat-header">
        <div class="chat-header-left">
          <div class="avatar-wrap">
            <img src="tommy.png" alt="Chat avatar" class="avatar-img" />
          </div>
          <div class="chat-title-wrap">
            <h1 class="chat-title" id="chatTitle">Ask USG</h1>
            <p class="chat-subtitle">USC Undergraduate Student Government</p>
          </div>
        </div>
        <button class="chat-close" id="closeBtn" aria-label="Close chat">&times;</button>
      </div>

      <div class="messages" id="messages"></div>

      <div class="composer">
        <div class="composer-row">
          <input id="q" placeholder="Ask a question..." autocomplete="off" />
          <button id="send">Send</button>
        </div>
        <div class="status" id="status"></div>
      </div>
    </div>
  </div>

  <script>
    // same-origin when served by the local backend, Render otherwise
    const API = ["localhost", "127.0.0.1"].includes(location.hostname)
      ? "/api/chat"
      : "https://usg-chat-backend.onrender.com/api/chat";
    const MODE = new URLSearchParams(location.search).get("embed") || "bubble";
    document.body.classList.add(`mode-${MODE}`);
    const launcher = document.getElementById("launcher");
    const backdrop = document.getElementById("backdrop");
    const closeBtn = document.getElementById("closeBtn");
    const messages = document.getElementById("messages");
    const q = document.getElementById("q");
    const send = document.getElementById("send");
    const statusEl = document.getElementById("status");
    const history = [];

    /*function escapeHtml(s) {
      if (!s) return "";
      return String(s).replace(/[&<>"']/g, c => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#39;"
      }[c]));
    }*/

    function appendMessage(type, text, sources = []) {
      const wrap = document.createElement("div");
      wrap.className = `msg ${type}`;

      const bubble = document.createElement("div");
      bubble.className = "bubble";
      bubble.innerHTML = DOMPurify.sanitize(marked.parse(text));
      wrap.appendChild(bubble);

      if (Array.isArray(sources) && sources.length) {
        const sourcesDiv = document.createElement("div");
        sourcesDiv.className = "sources";
        sourcesDiv.innerHTML = `<div class="sources-label">Sources:</div>`;

        sources.forEach((s) => {
          const a = document.createElement("a");
          a.className = "source-link";
          a.href = s.source_url || "#";
          a.target = "_blank";
          a.rel = "noopener noreferrer";
          a.textContent = s.source_title || s.source_url || "Source";
          sourcesDiv.appendChild(a);
        });

        wrap.appendChild(sourcesDiv);
      }

      messages.appendChild(wrap);
      messages.scrollTop = messages.scrollHeight;
    }

    function reportState(open) {
      // Tells embed.js (overlay mode) to resize the corner iframe. No
      // sensitive payload, and the widget doesn't know its host, so "*".
      if (MODE === "overlay" && window.parent !== window) {
        window.parent.postMessage({ type: "usg-chat", open }, "*");
      }
    }

    function openChat() {
      backdrop.classList.add("open");
      launcher.style.display = "none";
      q.focus();
      reportState(true);
    }

    function closeChat() {
      if (MODE === "panel") return;
      backdrop.classList.remove("open");
      launcher.style.display = "flex";
      reportState(false);
    }

    launcher.addEventListener("click", openChat);
    closeBtn.addEventListener("click", closeChat);

    backdrop.addEventListener("click", (e) => {
      if (e.target === backdrop) closeChat();
    });

    document.addEventListener("keydown", (e) => {
      if (e.key === "Escape") closeChat();
    });

    if (MODE === "panel") openChat();

    async function sendMessage() {
      const text = q.value.trim();
      if (!text) return;

      appendMessage("user", text);
      q.value = "";
      send.disabled = true;
      statusEl.textContent = "Thinking...";

      const thinking = document.createElement("div");
      thinking.className = "msg bot";
      thinking.innerHTML = `<div class="bubble typing">...</div>`;
      messages.appendChild(thinking);
      messages.scrollTop = messages.scrollHeight;

      try {
        history.push({
          role: "user",
          content: text
        });
        const recentHistory = history.slice(-8);
        const r = await fetch(API + "/stream", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ message: text, history: recentHistory })
        });

        if (!r.ok || !(r.headers.get("content-type") || "").includes("text/event-stream")) {
          const js = await r.json().catch(() => ({}));
          throw new Error(js.error || "Request failed");
        }

        // swap the "..." bubble for a live one we append tokens into
        thinking.remove();
        const wrap = document.createElement("div");
        wrap.className = "msg bot";
        const bubble = document.createElement("div");
        bubble.className = "bubble";
        wrap.appendChild(bubble);
        messages.appendChild(wrap);

        const reader = r.body.getReader();
        const decoder = new TextDecoder();
        let buf = "";
        let full = "";
        let finalSources = [];
        let finalTraceId = null;
        let streamError = null;

        const render = () => {
          bubble.innerHTML = DOMPurify.sanitize(marked.parse(full));
          messages.scrollTop = messages.scrollHeight;
        };

        while (true) {
          const { done, value } = await reader.read();
          if (done) break;
          buf += decoder.decode(value, { stream: true });
          const parts = buf.split("\n\n");
          buf = parts.pop();
          for (const part of parts) {
            if (!part.startsWith("data: ")) continue;
            const ev = JSON.parse(part.slice(6));
            if (ev.delta) {
              full += ev.delta;
              render();
            } else if (ev.crisis) {
              full = ev.answer || "Please call or text 988 right now.";
              finalSources = ev.sources || [];
              render();
            } else if (ev.done) {
              full += ev.notice || "";
              finalSources = ev.sources || finalSources;
              finalTraceId = ev.traceId || null;
            } else if (ev.error) {
              streamError = ev.error;
            }
          }
        }

        if (streamError && !full) throw new Error(streamError);

        // thumbs feedback -> /api/feedback -> Langfuse score (skip crisis)
        if (finalTraceId) {
          const fb = document.createElement("div");
          fb.className = "feedback";
          [["👍", 1], ["👎", 0]].forEach(([label, value]) => {
            const b = document.createElement("button");
            b.textContent = label;
            b.setAttribute("aria-label", value ? "Helpful" : "Not helpful");
            b.addEventListener("click", () => {
              if (fb.classList.contains("done")) return;
              fb.classList.add("done");
              b.classList.add("picked");
              fetch(API.replace(/\/chat$/, "/feedback"), {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ traceId: finalTraceId, value })
              }).catch(() => {});
            });
            fb.appendChild(b);
          });
          wrap.appendChild(fb);
        }

        full = full.replace(/\[source:(.*?)\|(.*?)\]/g, "").trim();
        render();

        const uniqueSourcesMap = new Map();
        finalSources.forEach((s) => {
          const key = s.source_url || s.source_title || Math.random().toString(36);
          if (!uniqueSourcesMap.has(key)) uniqueSourcesMap.set(key, s);
        });
        if (uniqueSourcesMap.size) {
          const sourcesDiv = document.createElement("div");
          sourcesDiv.className = "sources";
          sourcesDiv.innerHTML = `<div class="sources-label">Sources:</div>`;
          uniqueSourcesMap.forEach((s) => {
            const a = document.createElement("a");
            a.className = "source-link";
            a.href = s.source_url || "#";
            a.target = "_blank";
            a.rel = "noopener noreferrer";
            a.textContent = s.source_title || s.source_url || "Source";
            sourcesDiv.appendChild(a);
          });
          wrap.appendChild(sourcesDiv);
          messages.scrollTop = messages.scrollHeight;
        }

        history.push({
          role: "assistant",
          content: full || ""
        });
        statusEl.textContent = "";
      } catch (e) {
        thinking.remove();
        appendMessage("bot", "Error contacting backend.");
        statusEl.textContent = e.message || "Error";
        console.error("Chat error", e);
      } finally {
        send.disabled = false;
      }
    }

    send.addEventListener("click", sendMessage);

    q.addEventListener("keydown", (e) => {
      if (e.key === "Enter") sendMessage();
    });
  </script>
</body>
</html>
